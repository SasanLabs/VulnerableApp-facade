worker_processes 1;
env ENABLE_VULNERABLEAPP_JSP;
env ENABLE_VULNERABLEAPP_PHP;
env ENABLE_LLMFORGE;
error_log logs/error.log info;

events {
    worker_connections 512;
}

http {
    include mime.types;
    sendfile on;

    server {
        client_max_body_size 0;

        location /VulnerableApp {
			# As VulnerableApp-Facade should run even if some of the Vulnerable Applications are not present
			# there for added below configuration.
			# https://stackoverflow.com/questions/32845674/setup-nginx-not-to-crash-if-host-in-upstream-is-not-found
			resolver 127.0.0.11;
			set $VulnerableApplication VulnerableApp-base;
            proxy_pass http://$VulnerableApplication:9090;
        }

        location /VulnerableApp-jsp {
			# As VulnerableApp-Facade should run even if some of the Vulnerable Applications are not present
			# there for added below configuration.
			# https://stackoverflow.com/questions/32845674/setup-nginx-not-to-crash-if-host-in-upstream-is-not-found
			resolver 127.0.0.11;
			set $VulnerableApplication VulnerableApp-jsp;
			proxy_pass http://$VulnerableApplication:8080;
        }

        location /VulnerableApp-php {
			# As VulnerableApp-Facade should run even if some of the Vulnerable Applications are not present
			# there for added below configuration.
			# https://stackoverflow.com/questions/32845674/setup-nginx-not-to-crash-if-host-in-upstream-is-not-found
			resolver 127.0.0.11;
			set $VulnerableApplication VulnerableApp-php;
			proxy_pass http://$VulnerableApplication:80;
        }

        location /llmforge {
			# As VulnerableApp-Facade should run even if some of the Vulnerable Applications are not present
			# there for added below configuration.
			# https://stackoverflow.com/questions/32845674/setup-nginx-not-to-crash-if-host-in-upstream-is-not-found
			resolver 127.0.0.11;
			set $VulnerableApplication llmforge;
			proxy_connect_timeout 120s;
			proxy_send_timeout 120s;
			proxy_read_timeout 120s;
			proxy_pass http://$VulnerableApplication:8000;
        }

        location /mailpit {
			resolver 127.0.0.11;
			set $VulnerableApplication mailpit;
			proxy_pass http://$VulnerableApplication:8025;
        }

        location = /VulnerabilityDefinitions {
			default_type 'application/json';
			content_by_lua_block {
				local vulnerableAppResponse = ngx.location.capture("/VulnerableApp/VulnerabilityDefinitions")
				local vulnerableAppJspResponse
				local vulnerableAppPhpResponse
				local llmForgeResponse

				if os.getenv("ENABLE_VULNERABLEAPP_JSP") == "true" then
					vulnerableAppJspResponse = ngx.location.capture("/VulnerableApp-jsp/VulnerabilityDefinitions")
				else
					vulnerableAppJspResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_VULNERABLEAPP_PHP") == "true" then
					vulnerableAppPhpResponse = ngx.location.capture("/VulnerableApp-php/VulnerabilityDefinitions")
				else
					vulnerableAppPhpResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_LLMFORGE") == "true" then
					llmForgeResponse = ngx.location.capture("/llmforge/VulnerabilityDefinitions")
				else
					llmForgeResponse = { status = 204, body = "" }
				end

				ngx.say(require("vulnerableapp_utility").merge_vulnerability_information(vulnerableAppResponse, vulnerableAppJspResponse, vulnerableAppPhpResponse, llmForgeResponse))
			}
        }

        location = /scanner/dast {
			default_type 'application/json';
			content_by_lua_block {
				local vulnerableAppResponse = ngx.location.capture("/VulnerableApp/scanner/dast")
				local vulnerableAppJspResponse
				local vulnerableAppPhpResponse
				local llmForgeResponse

				if os.getenv("ENABLE_VULNERABLEAPP_JSP") == "true" then
					vulnerableAppJspResponse = ngx.location.capture("/VulnerableApp-jsp/scanner/dast")
				else
					vulnerableAppJspResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_VULNERABLEAPP_PHP") == "true" then
					vulnerableAppPhpResponse = ngx.location.capture("/VulnerableApp-php/scanner/dast")
				else
					vulnerableAppPhpResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_LLMFORGE") == "true" then
					llmForgeResponse = ngx.location.capture("/llmforge/scanner/dast")
				else
					llmForgeResponse = { status = 204, body = "" }
				end

				ngx.say(require("vulnerableapp_utility").merge_vulnerability_information(vulnerableAppResponse, vulnerableAppJspResponse, vulnerableAppPhpResponse, llmForgeResponse))
			}
        }

        location = /scanner/sast {
			default_type 'application/json';
			content_by_lua_block {
				local vulnerableAppResponse = ngx.location.capture("/VulnerableApp/scanner/sast")
				local vulnerableAppJspResponse
				local vulnerableAppPhpResponse
				local llmForgeResponse

				if os.getenv("ENABLE_VULNERABLEAPP_JSP") == "true" then
					vulnerableAppJspResponse = ngx.location.capture("/VulnerableApp-jsp/scanner/sast")
				else
					vulnerableAppJspResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_VULNERABLEAPP_PHP") == "true" then
					vulnerableAppPhpResponse = ngx.location.capture("/VulnerableApp-php/scanner/sast")
				else
					vulnerableAppPhpResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_LLMFORGE") == "true" then
					llmForgeResponse = ngx.location.capture("/llmforge/scanner/sast")
				else
					llmForgeResponse = { status = 204, body = "" }
				end

				ngx.say(require("vulnerableapp_utility").merge_vulnerability_information(vulnerableAppResponse, vulnerableAppJspResponse, vulnerableAppPhpResponse, llmForgeResponse))
			}
        }

        location = /sitemap.xml {
			default_type 'application/xml';
			content_by_lua_block {
				local vulnerableAppResponse = ngx.location.capture("/VulnerableApp/sitemap.xml")
				local vulnerableAppJspResponse
				local vulnerableAppPhpResponse
				local llmForgeResponse

				if os.getenv("ENABLE_VULNERABLEAPP_JSP") == "true" then
					vulnerableAppJspResponse = ngx.location.capture("/VulnerableApp-jsp/sitemap.xml")
				else
					vulnerableAppJspResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_VULNERABLEAPP_PHP") == "true" then
					vulnerableAppPhpResponse = ngx.location.capture("/VulnerableApp-php/sitemap.xml")
				else
					vulnerableAppPhpResponse = { status = 204, body = "" }
				end

				if os.getenv("ENABLE_LLMFORGE") == "true" then
					llmForgeResponse = ngx.location.capture("/llmforge/sitemap.xml")
				else
					llmForgeResponse = { status = 204, body = "" }
				end

				ngx.say(require("vulnerableapp_utility").merge_sitemap_information(vulnerableAppResponse, vulnerableAppJspResponse, vulnerableAppPhpResponse, llmForgeResponse))
			}
        }

        location / {
            root /usr/share/nginx/html;
        }
    }

    # https://serverfault.com/questions/379675/nginx-reverse-proxy-url-rewrite
}
